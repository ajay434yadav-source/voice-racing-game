<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Voice Racing World</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif}
#ui{position:fixed;z-index:10;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#mic,#cmd{border:0;border-radius:14px;padding:12px 16px;font-weight:800;font-size:15px;background:#111;color:white;box-shadow:0 3px 10px #0004}
#cmd{background:#ffffffeb;color:#111;flex:1;min-width:180px}
#status{position:fixed;z-index:10;bottom:12px;left:10px;right:10px;background:#ffffffdf;border-radius:14px;padding:10px;text-align:center;font-weight:700}
#help{font-size:12px;font-weight:500;margin-top:3px}
#err{color:#b00020;font-size:12px}
</style>
</head>
<body>
<div id="ui">
<button id="mic">🎤 आवाज़ शुरू करें</button>
<input id="cmd" placeholder="उदाहरण: कार चलाओ / रुको / बाएं मुड़ो">
</div>
<div id="status">3D गेम लोड हो रहा है...</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x86d5ff);
scene.fog=new THREE.Fog(0x86d5ff,45,220);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
camera.position.set(0,7,12);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x557755,2));
const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(30,60,20);sun.castShadow=true;scene.add(sun);

const roadMat=new THREE.MeshStandardMaterial({color:0x444444});
const grassMat=new THREE.MeshStandardMaterial({color:0x62b44b});
const road=new THREE.Mesh(new THREE.PlaneGeometry(18,500),roadMat);
road.rotation.x=-Math.PI/2;road.position.z=-130;road.receiveShadow=true;scene.add(road);

const grass=new THREE.Mesh(new THREE.PlaneGeometry(180,500),grassMat);
grass.rotation.x=-Math.PI/2;grass.position.y=-.05;grass.position.z=-130;scene.add(grass);

const laneMat=new THREE.MeshBasicMaterial({color:0xffffff});
for(let z=0;z>-500;z-=10){
 const mark=new THREE.Mesh(new THREE.BoxGeometry(.18,.03,5),laneMat);
 mark.position.set(0,.02,z);scene.add(mark);
}

function car(color,scale=1){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(2.5,.65,4),new THREE.MeshStandardMaterial({color}));
 body.position.y=.75;body.castShadow=true;g.add(body);
 const top=new THREE.Mesh(new THREE.BoxGeometry(1.65,.55,1.8),new THREE.MeshStandardMaterial({color:0x222a32,metalness:.2}));
 top.position.set(0,1.25,-.15);top.castShadow=true;g.add(top);
 for(const x of [-1.35,1.35])for(const z of [-1.35,1.35]){
   const w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.28,18),new THREE.MeshStandardMaterial({color:0x111111}));
   w.rotation.z=Math.PI/2;w.position.set(x,.48,z);w.castShadow=true;g.add(w);
 }
 g.scale.setScalar(scale);return g;
}
const player=car(0xff3333,1);
player.position.set(0,0,8);scene.add(player);

// lots of traffic cars
for(let i=0;i<28;i++){
 const c=car([0x1976d2,0xffc107,0x7b1fa2,0x00a884,0xffffff][i%5],.8);
 c.position.set([-5,-2.5,2.5,5][i%4],0,-15-i*16);
 c.userData.speed=.025+(i%4)*.01;
 scene.add(c);
}

// roadside trees
for(let i=0;i<50;i++){
 const side=i%2?12:-12;
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,2,8),new THREE.MeshStandardMaterial({color:0x70452a}));
 const crown=new THREE.Mesh(new THREE.SphereGeometry(1.5,10,10),new THREE.MeshStandardMaterial({color:0x198b3b}));
 const t=new THREE.Group();trunk.position.y=1;crown.position.y=2.5;t.add(trunk,crown);
 t.position.set(side,0,-i*10-5);scene.add(t);
}

let mode='idle',turn=0,boost=false;
const status=document.getElementById('status');
function say(s){status.textContent=s}
function command(raw){
 const c=raw.toLowerCase().replace(/[.,!?।]/g,'');
 if(c.includes('कार')&&(c.includes('चल')||c.includes('ड्राइव')||c.includes('दौड़'))){mode='drive';say('🏎️ कार चल रही है');return}
 if(c.includes('रुक')){mode='stop';say('🛑 कार रुक गई');return}
 if(c.includes('बाएं')||c.includes('लेफ्ट')){turn=-1;say('⬅️ बाएं मुड़ रहा हूँ');return}
 if(c.includes('दाएं')||c.includes('राइट')){turn=1;say('➡️ दाएं मुड़ रहा हूँ');return}
 if(c.includes('सीधा')||c.includes('आगे')){turn=0;mode='drive';say('⬆️ आगे चल रहा हूँ');return}
 if(c.includes('तेज')||c.includes('स्पीड')){boost=true;say('⚡ स्पीड बढ़ गई');return}
 if(c.includes('धीरे')){boost=false;say('🐢 धीरे चल रहा हूँ');return}
 if(c.includes('हॉर्न')){say('📣 हॉर्न!');return}
 say('🤔 कमांड नहीं समझी: '+raw);
}
document.getElementById('cmd').addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.value.trim()){command(e.target.value);e.target.value=''}
});

let recognition,listening=false;
document.getElementById('mic').onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){say('❌ इस Chrome में voice recognition उपलब्ध नहीं है');return}
 if(location.protocol!=='https:'&&location.hostname!=='localhost'){
   say('🚫 Mic के लिए गेम को HTTPS वेबसाइट पर खोलें');
   return;
 }
 recognition=new SR();recognition.lang='hi-IN';recognition.continuous=true;recognition.interimResults=false;
 recognition.onstart=()=>{listening=true;document.getElementById('mic').textContent='🟢 सुन रहा हूँ';say('🎤 बोलिए: कार चलाओ, बाएं मुड़ो...')};
 recognition.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)command(e.results[i][0].transcript)};
 recognition.onerror=e=>say(e.error==='not-allowed'?'🚫 Chrome में Microphone → Allow करें':'⚠️ Mic: '+e.error);
 recognition.onend=()=>{if(listening)try{recognition.start()}catch(e){}};
 recognition.start();
};

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=clock.getDelta();
 let speed=mode==='drive'?(boost?1.0:.45):0;
 player.position.z-=speed*dt*12;
 player.position.x+=turn*dt*5;
 player.position.x=Math.max(-6,Math.min(6,player.position.x));
 player.rotation.y=-turn*.12;
 camera.position.x+=(player.position.x*.45-camera.position.x)*.08;
 camera.position.z+=(player.position.z+11-camera.position.z)*.08;
 camera.lookAt(player.position.x,1,player.position.z-9);
 for(const o of scene.children)if(o.userData&&o.userData.speed)o.position.z+=o.userData.speed;
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
say('🏁 3D रेसिंग गेम तैयार — आवाज़ से कार चलाएँ');
</script>
</body>
</html>
